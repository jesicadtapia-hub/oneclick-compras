<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{

html{background:var(--bg)}

main{max-width:1400px;margin:0 auto;padding:2rem 2rem 4rem}

/* UPLOAD */
.upload-zone{border:1px solid var(--border2);border-radius:var(--radius);padding:3.5rem 2rem;text-align:center;cursor:pointer;background:var(--bg2);transition:background 0.15s,border-color 0.15s;margin-bottom:2rem}

.upload-zone h2{font-size:17px;font-weight:500;margin-bottom:5px;letter-spacing:-0.2px}

/* PANELS */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1.25rem}
.section-title{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:0.07em;text-transform:uppercase;margin-bottom:12px}

/* PO NAME BAR */
.po-bar{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm)}
.po-bar label{font-size:12px;color:var(--text2);white-space:nowrap;font-weight:500}
.po-bar input{flex:1;max-width:280px;font-family:inherit;font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);outline:none}

/* TABLE */

table{width:100%;border-collapse:collapse;font-size:12px}

</style>

<script>
const SK_LT='o_lead_v3',SK_OV='o_ov_v3',SK_PN='o_ponames_v3',SK_FILE='o_file_v3';
let allRows=[],headers=[],provLT={},poOverrides={},poNames={},pending=[],curModal=null,activeStatus='overdue',sortCol=-1,sortAsc=true,colFilters={},ingramAvailable={};

const HIDE_COLS=new Set(['Movimientos de stock/Ubicación intermedia','Movimientos de stock/Distribución analítica']);

// IndexedDB for file persistence
const DB_NAME='oneclick_ordenes',DB_VER=1,STORE='files';
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{e.target.result.createObjectStore(STORE);};
    req.onsuccess=e=>{db=e.target.result;res(db);};
    req.onerror=()=>rej();
  });
}
function saveFileToDB(arrayBuffer,name){
  return openDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put({buf:arrayBuffer,name,ts:Date.now()},SK_FILE);
    tx.oncomplete=res;tx.onerror=rej;
  }));
}
function loadFileFromDB(){
  return openDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readonly');
    const req=tx.objectStore(STORE).get(SK_FILE);
    req.onsuccess=e=>res(e.target.result||null);
    req.onerror=()=>res(null);
  }));
}
const SHORT={
  'Movimientos de stock/Referencia':'Referencia',
  'Movimientos de stock/Producto/Referencia interna':'SKU',
  'Movimientos de stock/Producto/Nombre':'Producto',
  'Movimientos de stock/Línea de movimiento/Contacto':'Proveedor',
  'Movimientos de stock/Producto/Categoría del producto':'Categoría',
  'Movimientos de stock/Producto/Marca':'Marca',

function parseDate(s){
  if(!s)return null;if(s instanceof Date)return isNaN(s.getTime())?null:s;
  const d=new Date(s);if(!isNaN(d.getTime()))return d;
  const m=String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return new Date(+m[3],+m[2]-1,+m[1]);return null;
}
function getDateCols(){return headers.map((h,i)=>({h,i})).filter(({h})=>h&&/fecha|date|delivery|entrega|venc|plazo|sched|reservar/i.test(String(h))).map(x=>x.i);}
function getETA(row){const dc=getDateCols();for(const ci of dc){const d=parseDate(row[ci]);if(d)return{date:d,colIdx:ci};}return null;}
function getPOKey(row){const idx=headers.findIndex(h=>h&&/\bpo\b|orden|order|ref\b|number|n°|nro/i.test(String(h)));return idx>=0&&row[idx]?String(row[idx]).trim():null;}
function daysDiff(d){const t=new Date();t.setHours(0,0,0,0);return Math.floor((t-d)/86400000);}
function getStatus(days){if(days>30)return'critical';if(days>14)return'warning';if(days>0)return'late';return null;}
function getEffectiveDate(row,poKey){
  if(poKey&&poOverrides[poKey]){const d=parseDate(poOverrides[poKey]);if(d)return{date:d,source:'override'};}
  const eta=getETA(row);if(eta)return{date:eta.date,source:'original'};return null;
}
function computeDueDate(row,poKey){
  const prov=row[3]?String(row[3]).trim():'';
  const eff=getEffectiveDate(row,poKey);if(!eff)return null;
  const lt=provLT[prov]||0;const due=new Date(eff.date);due.setDate(due.getDate()+lt);
  return{date:due,source:eff.source};
}

function getQtyIdx(){return headers.findIndex(h=>h&&/cantidad real|qty|quantity/i.test(String(h)));}
function parseQty(v){
  if(v===null||v===undefined) return 0;
  if(typeof v==='number') return v;
  // Handle formatted strings like "1,860.00" or "1.860,00"
  var s=String(v).trim().replace(/[\s]/g,'');
  // Detect format: if both . and , present, last one is decimal separator
  var hasDot=s.includes('.');var hasComma=s.includes(',');
  if(hasDot&&hasComma){
    // e.g. "1,860.00" → remove commas; "1.860,00" → remove dots, replace comma
    var lastDot=s.lastIndexOf('.');var lastComma=s.lastIndexOf(',');
    if(lastDot>lastComma){s=s.replace(/,/g,'');}          // 1,860.00
    else{s=s.replace(/\./g,'').replace(',','.');}          // 1.860,00
  } else if(hasComma){
    // "1860,00" or "1,860" — if comma followed by exactly 2 digits at end: decimal
    s=/,\d{2}$/.test(s)?s.replace(',','.'):s.replace(/,/g,'');
  }
  return parseFloat(s)||0;
}

function getFilteredRows(){
  const fp=document.getElementById('fp').value;
  const fq=(document.getElementById('fq').value||'').toLowerCase();
  const qtyIdx=getQtyIdx();
  return allRows.map(row=>{
    if(qtyIdx>=0){const q=parseQty(row[qtyIdx]);if(q===0)return null;}
    const prov=row[3]?String(row[3]).trim():'';
    const poKey=getPOKey(row);
    const due=computeDueDate(row,poKey);
    const days=due?daysDiff(due.date):null;
    const isOverdue=days!==null&&days>0;
    const status=isOverdue?getStatus(days):null;
    const hasOverride=!!(poKey&&poOverrides[poKey]);
    // daysUntil: positive = future, negative = past
    const daysUntil=days!==null?-days:null;
    return{row,prov,poKey,due,days,daysUntil,isOverdue,status,hasOverride};
  }).filter(x=>{
    if(!x||!x.due) return false;
    // Proveedor
    if(fp&&x.prov!==fp) return false;
    // Búsqueda libre
    if(fq&&!x.row.some(c=>c&&String(c).toLowerCase().includes(fq))) return false;
    // Chip de estado
    if(activeStatus==='overdue'&&!x.isOverdue) return false;
    if(activeStatus==='upcoming'&&x.isOverdue) return false;
    if(activeStatus==='override'&&!x.hasOverride) return false;
    if(activeStatus==='critical'&&x.status!=='critical') return false;
    if(activeStatus==='warning'&&x.status!=='warning') return false;
    if(activeStatus==='late'&&x.status!=='late') return false;
    if(activeStatus==='ingram_ok'){
      const iOK=isIngramAvailable(x.poKey,x.row);
      const iQty=getIngramQty(x.poKey,x.row);
      const rQty=parseFloat(x.row[9])||0;
      if(!iOK||iQty<rQty) return false;
    }
    if(activeStatus==='no_ingram'&&isIngramAvailable(x.poKey,x.row)) return false;
    // Filtros por columna
    for(const [colLabel,vals] of Object.entries(colFilters)){
      if(!vals||vals.size===0) continue;
      const cv=getCellValForLabel(x.row,x,colLabel);
      if(!vals.has(String(cv).trim())) return false;
    }
    return true;
  }).sort((a,b)=>{
    // overdue sorted by most days first, upcoming by soonest first
    if(a.isOverdue&&b.isOverdue)return b.days-a.days;
    if(!a.isOverdue&&!b.isOverdue)return a.daysUntil-b.daysUntil;
    return a.isOverdue?-1:1; // overdue first
  });
}

function fmtDate(d){if(!d)return'';try{return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});}catch(e){return String(d);}}

function render(){
  const filtered=getFilteredRows();
  const vc=visibleCols();
  document.getElementById('row-count').textContent=filtered.length?`${filtered.length} orden${filtered.length!==1?'es':''}`:'' ;

  // Headers
  const extraHdrs=['Nombre PO','Fecha Orig.','Fecha Límite','Días','Estado','Ingram','Reclamo','Fecha Manual'];
  const allHdrs=[...vc.map(({h},ci)=>({label:sn(h),ci,ei:-1})),...extraHdrs.map((h,ei)=>({label:h,ci:-1,ei}))];
  document.getElementById('thead').innerHTML=allHdrs.map(({label,ci,ei})=>{
    const isFiltered=colFilters[label]&&colFilters[label].size>0;
    const sortId=ci>=0?ci:-(ei+10);
    const sortIcon=`<span class="sort-icon">${sortCol===sortId?(sortAsc?'↑':'↓'):'↕'}</span>`;
    const filterBtn=`<span class="col-filter-wrap"><button class="col-filter-btn${isFiltered?' active':''}" onclick="openColFilter(event,'${label}')" title="Filtrar">▾</button></span>`;
    return`<th onclick="if(event.target.classList.contains('col-filter-btn')||event.target.closest('#col-filter-panel'))return;sortByCol(${ci},${ei})">${label}${sortIcon}${filterBtn}<div class="col-dropdown" id="cfd-${label.replace(/[^a-z0-9]/gi,'_')}"></div></th>`;
  }).join('');

  if(!filtered.length){
    document.getElementById('tbody').innerHTML=`<tr><td colspan="${vc.length+extraHdrs.length}" class="empty">No hay órdenes pasadas con estos filtros</td></tr>`;
    return;
  }

  document.getElementById('tbody').innerHTML=filtered.map(({row,poKey,due,days,daysUntil,isOverdue,status,hasOverride})=>{
    const cls=status==='critical'?'row-crit':status==='warning'?'row-warn':'';
    const cells=vc.map(({i,h})=>{
      let v=row[i]||'';
      const short=sn(h);
      // Shorten Ref OC: extract (Corpo) or (Ventas) → show tag
      if(short==='Ref. OC'&&v){
        const vs=String(v);
        const m=vs.match(/\((Corpo|Ventas)\)/i);
        const tipo=m?m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase():'Ventas';
        const isCorpo=tipo==='Corpo';
        const tag=isCorpo?'<span class="oc-tag oc-corpo">Corpo</span>':'<span class="oc-tag oc-ventas">Ventas</span>';
        const base=vs.replace(/\s*\([^)]*\)/g,'').trim();
        v=tag;
      }
      const isNum=/qty|cantidad|precio|unit/i.test(short);
      return`<td class="${isNum?'num':''}">${v}</td>`;
    }).join('');
    const origDate=fmtDate(getETA(row)?.date);
    const effDate=fmtDate(due.date);
    const dueDisplay=hasOverride?`${effDate}<span class="po-tag">manual</span>`:effDate;

    // Ingram check — must be declared BEFORE use below
    const ingramOK=isIngramAvailable(poKey,row);
    const ingramQty=getIngramQty(poKey,row);

    // Days cell & badge — different for overdue vs upcoming
    // Check if Ingram covers the qty needed for this row
    const rowQty=parseQty(row[9]);
    const ingramCovers=ingramOK&&ingramQty>=rowQty&&rowQty>0;
    let dayCell,badge;
    if(isOverdue){
      if(ingramCovers){
        badge='<span class="badge" style="background:rgba(50,215,75,0.15);color:var(--green)">✓ Ingram OK</span>';
        dayCell=`<td class="num" style="font-weight:600;color:var(--green)">+${days}d</td>`;
      } else {
        badge=status==='critical'?'<span class="badge b-red">Crítico</span>':status==='warning'?'<span class="badge b-amber">Advertencia</span>':'<span class="badge b-gray">Leve</span>';
        dayCell=`<td class="num" style="font-weight:600;color:var(--red)">+${days}d</td>`;
      }
    } else {
      const soon=daysUntil!==null&&daysUntil<=7;
      badge=`<span class="badge b-blue">${soon?'⏰ Esta semana':'Próxima'}</span>`;
      dayCell=`<td class="num" style="font-weight:500;color:var(--blue)">${daysUntil!==null?daysUntil+'d':''}</td>`;
    }

    // Reminder cell: show reclamo date if overdue (7d from now by default, editable)
    const reclKey=poKey?'recl_'+poKey:null;
    const reclVal=reclKey&&poOverrides[reclKey]?poOverrides[reclKey]:'';
    const reclCell=isOverdue&&poKey
      ?`<td><div class="override-wrap"><input type="date" class="override-input" value="${reclVal}" data-po="${reclKey}" onchange="setOverride(this)" title="Fecha de reclamo">${reclVal?`<button class="override-clear" data-po="${reclKey}" onclick="clearOverride(this)">✕</button>`:''}</div></td>`
      :`<td class="muted">—</td>`;

    const ovVal=poKey&&poOverrides[poKey]?poOverrides[poKey]:'';
    const ovCell=poKey
      ?`<td><div class="override-wrap"><input type="date" class="override-input" value="${ovVal}" data-po="${poKey}" onchange="setOverride(this)">${ovVal?`<button class="override-clear" data-po="${poKey}" onclick="clearOverride(this)">✕</button>`:''}</div></td>`
      :`<td class="muted">—</td>`;
    const pnVal=poKey&&poNames[poKey]?poNames[poKey]:'';
    const pnCell=poKey
      ?`<td><input type="text" class="po-name-input" value="${pnVal.replace(/"/g,'&quot;')}" placeholder="Nombre PO..." data-po="${poKey}" onchange="setPOName(this)" onblur="setPOName(this)"></td>`
      :`<td class="muted">—</td>`;
    const ingramCell=ingramOK
      ?`<td><span class="ingram-tag">✓ ${ingramQty} disp.</span></td>`
      :`<td class="muted" style="font-size:11px">—</td>`;
    return`<tr class="${cls}">${cells}${pnCell}<td>${origDate}</td><td>${dueDisplay}</td>${dayCell}<td>${badge}</td>${ingramCell}${reclCell}${ovCell}</tr>`;
  }).join('');
}

function getCellValForLabel(row, computed, label){
  const vc=visibleCols();
  // Extra cols
  if(label==='Nombre PO') return computed.poKey&&poNames[computed.poKey]?poNames[computed.poKey]:'';
  if(label==='Fecha Orig.') return fmtDate(getETA(row)?.date)||'';
  if(label==='Fecha Límite') return computed.due?fmtDate(computed.due.date):'';
  if(label==='Días') return computed.days!==null?String(computed.days):'';
  if(label==='Estado'){
    if(!computed.isOverdue) return computed.daysUntil!==null&&computed.daysUntil<=7?'Esta semana':'Próxima';
    return computed.status==='critical'?'Crítico':computed.status==='warning'?'Advertencia':'Leve';
  }
  if(label==='Ref. OC'){
    const col=vc.find(x=>sn(x.h)===label);
    if(!col) return '';
    const v=String(row[col.i]||'');
    const m=v.match(/\((Corpo|Ventas)\)/i);
    return m?m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase():'Ventas';
  }
  // Normal col
  const col=vc.find(x=>sn(x.h)===label);
  if(col) return String(row[col.i]||'');
  return '';
}

function getUniqueColValues(label){
  const qtyIdx=getQtyIdx();
  const vals=new Set();
  allRows.forEach(row=>{
    if(qtyIdx>=0){const q=parseQty(row[qtyIdx]);if(q===0)return;}
    const poKey=getPOKey(row);
    const due=computeDueDate(row,poKey);if(!due)return;
    const days=daysDiff(due.date);
    const daysUntil=-days;
    const isOverdue=days>0;
    const status=isOverdue?getStatus(days):null;
    const hasOverride=!!(poKey&&poOverrides[poKey]);
    const computed={row,prov:row[3]?String(row[3]).trim():'',poKey,due,days,daysUntil,isOverdue,status,hasOverride};
    const v=getCellValForLabel(row,computed,label);
    if(v!=='')vals.add(String(v).trim());
  });
  return [...vals].sort((a,b)=>a.localeCompare(b,'es'));
}

function openColFilter(e, label){

function toggleColFilter(label, val, checked){
  if(!colFilters[label]) colFilters[label]=new Set();
  if(checked) colFilters[label].add(val);
  else colFilters[label].delete(val);
  if(colFilters[label].size===0) delete colFilters[label];
  render();
}

function clearColFilter(label){

  render();
  document.querySelectorAll('.col-dropdown.open').forEach(d=>d.classList.remove('open'));
}

function handleIngramFile(input){
  if(!input.files[0]) return;
  var f=input.files[0];
  var r=new FileReader();
  r.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var data=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
      processIngramData(data, f.name);
    }catch(err){alert('Error al leer Ingram: '+err.message);}
  };
  r.readAsArrayBuffer(f);
}

function processIngramData(data, filename){
  // Find header row (contains "Cust PO Number")
  var headerRow=-1;
  for(var i=0;i<data.length;i++){
    if(data[i] && data[i].some(function(c){return String(c||'').toLowerCase().includes('cust po');})){
      headerRow=i; break;
    }
  }
  if(headerRow<0){alert('No se encontró la columna "Cust PO Number" en el archivo Ingram.');return;}

  var hdrs=data[headerRow];
  var poCol=hdrs.findIndex(function(h){return String(h||'').toLowerCase().includes('cust po');});
  // "Shippable Qty" es la segunda columna con "shippable" — buscamos la que tiene "qty" también
  // Usar "Qty Ordered" (col H) para el cruce — es la cantidad de la orden
  var qtyCol=hdrs.findIndex(function(h){var s=String(h||'').toLowerCase();return s.includes('qty ordered')||s.includes('qty order');});
  if(qtyCol<0) qtyCol=hdrs.findIndex(function(h){var s=String(h||'').toLowerCase();return s.includes('ordered')&&!s.includes('ext');});
  if(qtyCol<0) qtyCol=7; // fallback: col 7 = Qty Ordered según estructura conocida
  // MFR Part Number = SKU del fabricante (col índice 2 típicamente, buscamos por nombre)
  var skuCol=hdrs.findIndex(function(h){var s=String(h||'').toLowerCase();return s.includes('mfr part')||s.includes('part number')||s.includes('part no');});
  if(skuCol<0) skuCol=2; // fallback: col 2 según estructura conocida

  if(poCol<0||qtyCol<0){alert('No se encontraron columnas de PO o Shippable Qty.');return;}

  // Build map: "poNum|SKU" -> shippable qty
  // Clave compuesta para cruzar PO + SKU exactamente
  ingramAvailable={};
  var matchCount=0;
  for(var j=headerRow+1;j<data.length;j++){
    var row=data[j];
    if(!row||!row[poCol]) continue;
    var rawPO=String(row[poCol]).trim();
    // Extraer número de PO: "17316 FTZ" -> "17316"
    var nums=rawPO.match(/\d+/);
    if(!nums) continue;
    var poNum=nums[0];
    var sku=skuCol>=0&&row[skuCol]?String(row[skuCol]).trim().toUpperCase():'';
    var qty=parseFloat(row[qtyCol])||0;
    if(qty>0){
      var key=poNum+'|'+sku;
      ingramAvailable[key]=(ingramAvailable[key]||0)+qty;
      matchCount++;
    }
  }

  var count=Object.keys(ingramAvailable).length;

  // Show banner
  var existing=document.getElementById('ingram-banner');
  if(existing) existing.remove();
  var banner=document.createElement('div');
  banner.id='ingram-banner';
  banner.className='ingram-banner';
  banner.innerHTML='<span>✓ Open Order de Ingram cargado: <strong style="color:var(--green)">'+count+' líneas PO+SKU con stock</strong></span>'
    +'<span style="font-size:11px;color:var(--text3)">'+filename+'</span>'
    +'<button onclick="clearIngram()" style="font-size:11px;color:var(--red);background:none;border:none;cursor:pointer;font-family:inherit;margin-left:auto">✕ Quitar</button>';
  var main=document.getElementById('main-content');
  if(main) main.insertAdjacentElement('afterbegin',banner);

  renderAll();
}

function clearIngram(){
  ingramAvailable={};
  var b=document.getElementById('ingram-banner');
  if(b) b.remove();
  // Reset file input so the same file puede volver a cargarse
  var fi=document.getElementById('ingram-fi');
  if(fi) fi.value='';
  renderAll();
}

// Obtiene el SKU de la fila actual (col 1 = referencia interna / SKU)
function getRowSKU(row){
  // Col 1 = "Movimientos de stock/Producto/Referencia interna" = SKU
  return row&&row[1]?String(row[1]).trim().toUpperCase():'';
}

function isIngramAvailable(poKey, row){
  if(!poKey||!Object.keys(ingramAvailable).length) return false;
  var nums=poKey.match(/\d+/);
  if(!nums) return false;
  var poNum=nums[0];
  var sku=row?getRowSKU(row):'';
  // Cruce exacto PO + SKU
  if(sku&&ingramAvailable[poNum+'|'+sku]) return true;
  return false;
}

function getIngramQty(poKey, row){
  if(!poKey) return 0;
  var nums=poKey.match(/\d+/);
  if(!nums) return 0;
  var poNum=nums[0];
  var sku=row?getRowSKU(row):'';
  if(sku) return ingramAvailable[poNum+'|'+sku]||0;
  return 0;
}

function buildEmailData(){
  var qtyIdx=getQtyIdx();
  var overdue=[], upcoming=[];
  allRows.forEach(function(row){
    if(qtyIdx>=0){var q=parseFloat(row[qtyIdx]);if(!isNaN(q)&&q===0)return;}
    var poKey=getPOKey(row);
    var due=computeDueDate(row,poKey);
    if(!due)return;
    var days=daysDiff(due.date);
    var daysUntil=-days;
    var prov=row[3]?String(row[3]).trim():'';

    // Filter out Harman
    if(/harman/i.test(prov)) return;

    var skuIdx=headers.findIndex(function(h){return h&&/referencia interna|sku/i.test(String(h));});
    var prodIdx=headers.findIndex(function(h){return h&&/producto.*nombre|^nombre/i.test(String(h));});
    var docIdx=headers.findIndex(function(h){return h&&/documento origen/i.test(String(h));});
    var ocIdx=headers.findIndex(function(h){return h&&/referencia de la orden|ref.*oc/i.test(String(h));});

    // Corpo/Ventas from Ref OC column
    var ocVal=ocIdx>=0?(row[ocIdx]||''):'';
    var ocMatch=String(ocVal).match(/\((Corpo|Ventas)\)/i);
    var tipo=ocMatch?ocMatch[1].charAt(0).toUpperCase()+ocMatch[1].slice(1).toLowerCase():'Ventas';

    var entry={
      sku:   skuIdx>=0?(row[skuIdx]||''):'',
      producto: prodIdx>=0?(row[prodIdx]||''):'',
      proveedor: prov,
      doc:   docIdx>=0?(row[docIdx]||''):'',
      fechaLimite: fmtDate(due.date),
      days:  days,
      daysUntil: daysUntil,
      tipo: tipo,
      poKey: poKey
    };
    if(days>0) overdue.push(entry);
    else if(daysUntil>=0&&daysUntil<=7) upcoming.push(entry);
  });
  overdue.sort(function(a,b){return b.days-a.days;});
  upcoming.sort(function(a,b){return a.daysUntil-b.daysUntil;});
  return {overdue:overdue, upcoming:upcoming};
}

function buildProviderHtml(prov, overdue, upcoming){
  var MAX=20;
  var d=new Date();var dd=String(d.getDate()).padStart(2,'0');var mm=String(d.getMonth()+1).padStart(2,'0');var yyyy=d.getFullYear();var today=dd+'-'+mm+'-'+yyyy;
  var od=overdue.slice(0,MAX), odExtra=overdue.length-MAX;
  var up=upcoming.slice(0,MAX);

  function badge(tipo){
    var col=tipo==='Corpo'?'#0a84ff':'#2e7d32';
    var bg=tipo==='Corpo'?'#e6f1fb':'#eaf3de';
    return '<span style="font-size:10px;font-weight:600;padding:1px 5px;border-radius:6px;background:'+bg+';color:'+col+'">'+tipo+'</span>';
  }
  function dias(r,isDue){
    if(isDue) return '<b style="color:#c62828">+'+r.days+'d</b>';
    if(r.daysUntil===0) return '<b style="color:#c62828">Hoy</b>';
    if(r.daysUntil===1) return '<b style="color:#e65100">Mañ.</b>';
    return '<b style="color:#2e7d32">'+r.daysUntil+'d</b>';
  }
  function tr(r,isDue,bg){
    return '<tr style="background:'+bg+';font-size:11px">'
      +'<td style="padding:5px 7px;border-bottom:1px solid #f0f0f0"><b>'+r.doc+'</b></td>'
      +'<td style="padding:5px 7px;border-bottom:1px solid #f0f0f0;color:#555">'+r.sku+'</td>'
      +'<td style="padding:5px 7px;border-bottom:1px solid #f0f0f0">'+r.producto+'</td>'
      +'<td style="padding:5px 7px;border-bottom:1px solid #f0f0f0;text-align:center">'+badge(r.tipo)+'</td>'
      +'<td style="padding:5px 7px;border-bottom:1px solid #f0f0f0;color:#555;white-space:nowrap">'+r.fechaLimite+'</td>'
      +'<td style="padding:5px 7px;border-bottom:1px solid #f0f0f0;text-align:center">'+dias(r,isDue)+'</td>'
      +'</tr>';
  }
  function th(txt,center){
    return '<th style="padding:6px 7px;font-size:10px;color:#666;text-align:'+(center?'center':'left')+';white-space:nowrap;border-bottom:1px solid #ddd;background:#f5f5f3">'+txt+'</th>';
  }
  var thead='<thead><tr>'+th('Doc')+th('SKU')+th('Producto')+th('Tipo',1)+th('Fecha')+th('Días',1)+'</tr></thead>';

  var s='<div style="font-family:Arial,sans-serif;max-width:680px;color:#1a1a1a">';
  s+='<div style="background:#1a1a1a;padding:12px 16px;border-radius:6px 6px 0 0">';
  s+='<b style="color:#fff;font-size:14px">oneclick</b><span style="color:#888;font-size:14px"> / '+prov+' — '+today+'</span>';
  s+='</div>';
  s+='<table style="width:100%;border-collapse:collapse;font-size:11px"><tr>';
  s+='<td style="padding:8px 14px;background:#fff8f8;width:50%;border:1px solid #eee;border-top:none"><div style="font-size:10px;color:#aaa">VENCIDAS</div><div style="font-size:20px;color:#c62828;font-weight:300">'+overdue.length+'</div></td>';
  s+='<td style="padding:8px 14px;background:#fffdf5;width:50%;border:1px solid #eee;border-top:none;border-left:none"><div style="font-size:10px;color:#aaa">ESTA SEMANA</div><div style="font-size:20px;color:#e65100;font-weight:300">'+upcoming.length+'</div></td>';
  s+='</tr></table>';

  if(od.length>0){
    s+='<div style="background:#fff2f2;padding:7px 12px;font-size:11px;font-weight:600;color:#c62828;border-top:2px solid #ffcdd2">⚠️ VENCIDAS'+(odExtra>0?' — top '+MAX+' de '+overdue.length:' ('+overdue.length+')')+'</div>';
    s+='<table style="width:100%;border-collapse:collapse">'+thead+'<tbody>';
    od.forEach(function(r,i){ s+=tr(r,true,i%2===0?'#fff':'#fafafa'); });
    s+='</tbody></table>';
    if(odExtra>0) s+='<div style="padding:5px 10px;font-size:10px;color:#999;background:#fafafa">...+'+odExtra+' más en la app</div>';
  }
  if(up.length>0){
    s+='<div style="background:#fff8f0;padding:7px 12px;font-size:11px;font-weight:600;color:#e65100;border-top:2px solid #ffe0b2;margin-top:8px">📅 ESTA SEMANA ('+upcoming.length+')</div>';
    s+='<table style="width:100%;border-collapse:collapse">'+thead+'<tbody>';
    up.forEach(function(r,i){ s+=tr(r,false,i%2===0?'#fff':'#fafafa'); });

  s+='<div style="padding:8px 12px;background:#f5f5f3;border-radius:0 0 6px 6px;font-size:10px;color:#999">Recordá realizar los reclamos correspondientes.</div>';
  s+='</div>';
  return s;

function sendWeeklyEmail(){
  var data=buildEmailData();
  if(data.overdue.length===0 && data.upcoming.length===0){
    alert('No hay órdenes vencidas ni próximas a vencer esta semana.');
    return;
  }
  var btn=document.getElementById('email-btn');
  btn.disabled=true;

  // Group by provider
  var byProv={};
  data.overdue.forEach(function(r){
    // Skip orders that are available in Ingram open order
    if(r.poKey&&isIngramAvailable(r.poKey,r.row)) return;
    if(!byProv[r.proveedor]) byProv[r.proveedor]={overdue:[],upcoming:[]};
    byProv[r.proveedor].overdue.push(r);
  });
  data.upcoming.forEach(function(r){
    if(!byProv[r.proveedor]) byProv[r.proveedor]={overdue:[],upcoming:[]};
    byProv[r.proveedor].upcoming.push(r);
  });

  var provs=Object.keys(byProv).sort();
  var today=(function(){var _x=new Date();return String(_x.getDate()).padStart(2,'0')+'-'+String(_x.getMonth()+1).padStart(2,'0')+'-'+_x.getFullYear();})();

  function sendNext(idx){
    if(idx>=provs.length){
      btn.textContent='✓ '+provs.length+' mail'+(provs.length>1?'s':'')+' enviado'+(provs.length>1?'s':'');
      btn.style.background='rgba(50,215,75,0.15)';
      btn.style.color='var(--green)';
      btn.style.borderColor='rgba(50,215,75,0.3)';
      setTimeout(function(){
        btn.textContent='⏰ Email semana';
        btn.style.background=''; btn.style.color=''; btn.style.borderColor='';
        btn.disabled=false;
      },4000);
      return;
    }
    var prov=provs[idx];
    var d=byProv[prov];
    btn.textContent='Enviando '+(idx+1)+'/'+provs.length+': '+prov.substring(0,20)+'...';
    var od=d.overdue.length, up=d.upcoming.length;
    var subj='⏰ Oneclick — '+prov+' · '+od+' vencida'+(od!==1?'s':'')+', '+up+' esta semana — '+today;
    var msg=buildProviderHtml(prov, d.overdue, d.upcoming);
    emailjs.send('service_walgxez','template_3olr3ig',{message:msg,subject:subj})
    .then(function(){
      // Small delay between sends to avoid rate limiting
      setTimeout(function(){ sendNext(idx+1); }, 600);
    },function(err){
      console.error('EmailJS error ('+prov+'):',err);
      alert('Error en mail de '+prov+': '+(err.status||'?')+' — '+(err.text||JSON.stringify(err)));
      btn.textContent='⏰ Email semana'; btn.disabled=false;
    });
  }
  sendNext(0);
}

function buildIngramCruceRows(){
  // Build lookup: "poNum|SKU" -> {qtyOrden, qtyIngram, rows[]}
  // Indices fijos según estructura conocida del Excel de órdenes
  const QTY_IDX=9;  // Movimientos de stock/Cantidad real
  const SKU_IDX=1;  // Movimientos de stock/Producto/Referencia interna
  const DOC_IDX=8;  // Movimientos de stock/Documento origen
  const PRV_IDX=3;  // Movimientos de stock/Línea de movimiento/Contacto

  // Paso 1: agrupar ordenes propias por poNum|SKU — solo Ingram Micro
  const mine={};
  allRows.forEach(row=>{
    if(!row||row.length<=QTY_IDX) return;
    const prov=row[PRV_IDX]!=null?String(row[PRV_IDX]).trim():'';
    if(!/ingram/i.test(prov)) return; // solo ordenes de Ingram Micro
    const qty=parseQty(row[QTY_IDX]);
    if(!qty) return; // saltar qty=0 o inválido
    const doc=row[DOC_IDX]!=null?String(row[DOC_IDX]).trim():'';
    const nums=doc.match(/\d+/);
    if(!nums)return;
    const poNum=nums[0];
    const sku=row[SKU_IDX]!=null?String(row[SKU_IDX]).trim().toUpperCase():'';
    if(!sku)return;
    const key=poNum+'|'+sku;
    const prod=row[2]!=null?String(row[2]).trim():'';
    if(!mine[key]) mine[key]={poNum,sku,prod,prov,doc,qtyMine:0,qtyIngram:0};
    mine[key].qtyMine+=isFinite(qty)?qty:0;
  });

  // Paso 2: sumar qtys de Ingram por poNum|SKU
  Object.keys(ingramAvailable).forEach(key=>{
    const qty=ingramAvailable[key];
    if(mine[key]){
      mine[key].qtyIngram=qty;
    } else {
      // Está en Ingram pero no en mis órdenes
      const [poNum,sku]=key.split('|');
      mine[key]={poNum,sku,prod:'(solo en Ingram)',prov:'Ingram Micro',doc:'PO-'+poNum,qtyMine:0,qtyIngram:qty};
    }
  });

  return Object.values(mine).map(r=>{
    let estado;
    if(r.qtyMine===0) estado='extra';          // solo Ingram
    else if(r.qtyIngram===0) estado='missing'; // no está en Ingram
    else if(r.qtyIngram>=r.qtyMine) estado='ok';
    else estado='partial';
    return {...r,estado};
  }).sort((a,b)=>{
    const ord={missing:0,partial:1,ok:2,extra:3};
    return (ord[a.estado]??9)-(ord[b.estado]??9)||a.doc.localeCompare(b.doc);
  });
}

function renderIngramCruce(){
  const allCruce=buildIngramCruceRows();
  const icSearch=((document.getElementById('ic-search')||{}).value||'').toLowerCase().trim();
  const filtered=allCruce.filter(r=>{
    if(icFilter!=='all'&&r.estado!==icFilter) return false;
    if(icSearch&&![r.doc,r.sku,r.prod,r.prov].some(v=>v&&v.toLowerCase().includes(icSearch))) return false;
    return true;
  });

  document.getElementById('ingram-cruce-count').textContent=filtered.length+' líneas';

  const hdrs=['PO','SKU','Producto','Proveedor','Qty Sistema','Qty Ingram','Diferencia','Estado'];
  document.getElementById('ic-thead').innerHTML=hdrs.map(h=>`<th>${h}</th>`).join('');

  if(!filtered.length){
    const cols=hdrs.length;
    document.getElementById('ic-tbody').innerHTML=`<tr><td colspan="${cols}" class="empty">${Object.keys(ingramAvailable).length===0?'Cargá el Open Order de Ingram primero (botón "Cruzar Ingram")':'Sin resultados para este filtro'}</td></tr>`;
    return;
  }

  document.getElementById('ic-tbody').innerHTML=filtered.map(r=>{
    const diff=r.qtyIngram-r.qtyMine;
    const diffStr=diff===0?'—':(diff>0?'+'+diff:String(diff));
    const diffColor=diff<0?'var(--red)':diff>0?'var(--green)':'var(--text2)';
    const badges={ok:'<span class="badge b-ok">✓ OK</span>',partial:'<span class="badge b-partial">⚠ Parcial</span>',missing:'<span class="badge b-missing">✗ Sin match</span>',extra:'<span class="badge b-extra">➕ Solo Ingram</span>'};
    const rowCls=r.estado==='missing'?'row-crit':r.estado==='partial'?'row-warn':'';
    return`<tr class="${rowCls}">
      <td style="font-size:11px;color:var(--text2)">${r.doc}</td>
      <td style="font-family:monospace;font-size:11px">${r.sku}</td>
      <td style="max-width:280px;white-space:normal;font-size:12px">${r.prod}</td>
      <td style="font-size:11px;color:var(--text2)">${r.prov}</td>
      <td class="num">${r.qtyMine||'—'}</td>
      <td class="num">${r.qtyIngram||'—'}</td>
      <td class="num" style="color:${diffColor};font-weight:600">${diffStr}</td>
      <td>${badges[r.estado]||''}</td>
    </tr>`;
  }).join('');
}

function exportFile(){
  const filtered=getFilteredRows();
  if(!filtered.length){alert('No hay filas para exportar.');return;}
  const today=(function(){var _x=new Date();return String(_x.getDate()).padStart(2,'0')+'-'+String(_x.getMonth()+1).padStart(2,'0')+'-'+_x.getFullYear();})();
  const vc=visibleCols();
  function cv(v){
    if(v===null||v===undefined)return'';
    if(typeof v==='object'){if(v instanceof Date)return fmtDate(v);return String(v);}
    if(typeof v==='string')return v;
    return v;
  }
  const hdrs=[...vc.map(({h})=>sn(h)),'Nombre PO','Fecha Orig.','Fecha Límite','Días Venc.','Estado','Fecha Manual'];
  const dataRows=filtered.map(({row,poKey,due,days,status,hasOverride})=>{
    const cells=vc.map(({i})=>cv(row[i]));
    const pnVal=(poKey&&poNames[poKey])?String(poNames[poKey]):'';
    const origDate=fmtDate(getETA(row)?.date)||'';
    const effDate=fmtDate(due.date)||'';
    const daysNum=Number(days);
    const lbl=status==='critical'?'Crítico':status==='warning'?'Advertencia':'Leve';
    const manual=(poKey&&poOverrides[poKey])?String(poOverrides[poKey]):'';
    return[...cells,pnVal,origDate,effDate,daysNum,lbl+(hasOverride?' ★':''),manual];
  });
  const qtyIdx=hdrs.indexOf('Qty');
  const qtySum=qtyIdx>=0?dataRows.reduce((a,r)=>{const v=r[qtyIdx];return a+(typeof v==='number'?v:parseFloat(v)||0);},0):0;
  const totRow=hdrs.map((_,i)=>i===0?'TOTAL':(i===qtyIdx?qtySum:''));
  const aoa=[
    [`Órdenes pasadas de fecha — Oneclick Compras · Exportado ${today}`],
    hdrs,
    ...dataRows,
    totRow,
  ];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const wMap={'Referencia':14,'SKU':13,'Producto':38,'Proveedor':17,'Categoría':15,'Marca':9,'Doc. Origen':11,'Qty':7,'Fecha Reserva':13,'Ref. OC':17,'P. Unit':11,'Nombre PO':18,'Fecha Orig.':12,'Fecha Límite':12,'Días Venc.':9,'Estado':12,'Fecha Manual':13};
  ws['!cols']=hdrs.map(h=>({wch:wMap[h]||12}));
  ws['!autofilter']={ref:`A2:${XLSX.utils.encode_col(hdrs.length-1)}2`};
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Órdenes Pasadas');
  XLSX.writeFile(wb,'ordenes_pasadas_fecha.xlsx');
}
